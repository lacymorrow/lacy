name: Feature Request
description: Suggest an improvement or new feature
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like?
      description: Describe the feature or improvement
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: When would you use this? What problem does it solve?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Detection (how Lacy classifies input)
        - Indicator (visual feedback)
        - Tool integration (Claude, Gemini, etc.)
        - Installation / setup
        - Configuration
        - Shell compatibility
        - Other
