name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell-syntax:
    name: Syntax (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, zsh]

    steps:
      - uses: actions/checkout@v6

      - name: Install zsh
        if: matrix.shell == 'zsh'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Syntax-check entry points
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          # Pick the right plugin file for this shell
          plugin="lacy.plugin.${{ matrix.shell }}"
          if [ -f "$plugin" ]; then
            echo "checking $plugin"
            ${{ matrix.shell }} -n "$plugin"
          fi

      - name: Syntax-check lib/
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          # zsh syntax check only zsh files; bash syntax check only sh + bash files
          if [ "${{ matrix.shell }}" = "zsh" ]; then
            files=(lib/**/*.zsh lib/*.zsh)
          else
            files=(lib/**/*.sh lib/**/*.bash lib/*.sh lib/*.bash)
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "no ${{ matrix.shell }} files to check under lib/"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "checking $f"
            ${{ matrix.shell }} -n "$f"
          done

  shellcheck:
    name: shellcheck (.sh / .bash only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # ShellCheck does NOT support zsh (SC1071), so we scan only POSIX/bash
      # script files. The two pre-existing SC2296 errors in lib/core/*.sh
      # come from intentional zsh-style parameter expansion inside files
      # that are sourced from zsh — those are excluded individually.
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error
          scandir: '.'
          ignore_paths: 'node_modules tests'
          ignore_names: 'config.sh preheat.sh'
          additional_files: 'install.sh uninstall.sh'
          format: gcc
          check_together: 'yes'
        env:
          SHELLCHECK_OPTS: '-e SC1071 -e SC2296'
